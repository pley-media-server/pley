# Pley with Docker Compose. From this folder:
#
#   ./setup.sh                     prepares everything and starts Pley, or:
#   cp .env.example .env           then edit it, and
#   docker compose up -d           (`docker compose logs pley` shows the setup link)
#
# Settings come from .env (see .env.example); each has a default, so this file
# also runs as it is. Hardware transcoding, a reverse proxy in Docker and the
# compatibility APIs on ports of their own are add-ons (compose.*.yaml, see
# README.md); they answer on Pley's port instead (Settings → Network), as the
# Plex-compatible one does by default.
#
# The container is locked down: it runs as an ordinary user, with no Linux
# capabilities, a read-only image and the media read-only, so the config
# folder is the only place it can write; and Pley is published on this
# computer only (127.0.0.1), for a reverse proxy in front of it.
name: pley

services:
  pley:
    image: ${PLEY_IMAGE:-pley:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # Shown beside the version in the apps; setup.sh sets it.
      args:
        PLEY_COMMIT: ${PLEY_COMMIT:-unknown}
    # "build": `up` builds the image from this checkout (unchanged layers are
    # cached), so `git pull && docker compose up -d` updates Pley. With a
    # published image (PLEY_IMAGE), use "missing" and `docker compose pull`.
    pull_policy: ${PLEY_PULL_POLICY:-build}
    container_name: pley
    restart: unless-stopped
    # Pley lets requests in progress finish for 5 s, then stops the
    # transcoder and closes the database: give it room (Docker's default
    # is 10 s before it kills the container).
    stop_grace_period: 30s

    # The user that owns the config folder and can read the media.
    user: "${PLEY_UID:-1000}:${PLEY_GID:-1000}"
    read_only: true
    tmpfs:
      # The transcoder's self-tests; SQLite keeps its temporary data in memory.
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    # Settings → Transcoder → Transcode in memory keeps the segments of the
    # streams being transcoded in /dev/shm, up to half of it (Docker's
    # default 64 MB is too little to offer it). Taken only as it is used.
    shm_size: ${PLEY_SHM_SIZE:-2gb}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Room for FFmpeg's threads, but not for a runaway process.
    pids_limit: 4096

    environment:
      # Pley runs as `user:` above. Only rootless Docker starts it as root
      # (PLEY_UID=0, which is you outside the container), and then it stays
      # root rather than becoming another user (deploy/docker/pley.sh).
      PUID: ${PLEY_UID:-1000}
      PGID: ${PLEY_GID:-1000}
      # The apps' search for servers on the network (the broadcast, Jellyfin's
      # and Bonjour) can't reach a container on Docker's own network: don't
      # listen for it.
      PLEY_NO_DISCOVERY: "true"
      PLEY_LOG: ${PLEY_LOG:-info}

    ports:
      # 127.0.0.1: only this computer (a reverse proxy here) reaches Pley.
      # Docker's port rules go around host firewalls such as ufw, so publish
      # it on every address (0.0.0.0:7539) only on purpose.
      - "${PLEY_LISTEN:-127.0.0.1:7539}:7539"

    volumes:
      # Database, artwork, caches and transcode segments.
      - type: bind
        source: ${PLEY_CONFIG_DIR:-./config}
        target: /config
        bind:
          create_host_path: false
      # Your media, read-only: libraries are folders under /media.
      - type: bind
        source: ${PLEY_MEDIA_DIR:-./media}
        target: /media
        read_only: true
        bind:
          create_host_path: false

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
