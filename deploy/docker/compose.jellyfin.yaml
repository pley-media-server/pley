# Add-on: the Jellyfin-compatible API (docs/COMPATIBILITY.md) on Jellyfin's
# own port, 8096, for apps that look for a server there. It answers on
# Pley's port anyway; here it moves to 8096, published like the web port: on
# this computer only unless PLEY_JELLYFIN_LISTEN says otherwise.
services:
  pley:
    environment:
      PLEY_JELLYFIN_BIND: 0.0.0.0:8096
    ports:
      - "${PLEY_JELLYFIN_LISTEN:-127.0.0.1:8096}:8096"
