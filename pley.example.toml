# Pley configuration. Copy to <data-dir>/pley.toml or pass --config <file>.
# Every key is optional; command-line flags and PLEY_* environment variables
# take precedence. Settings that admins change at runtime live in the web UI
# instead: the TMDB key and scanning under Settings → Server, hardware
# acceleration, tone mapping and transcode limits under Settings → Transcoder.

# Address to listen on. Use 127.0.0.1:7539 to stay local-only. Several,
# separated by commas, listen on chosen networks only: Pley must be able to
# listen on the first as it starts, and tries the others until it can (a
# Wi-Fi or VPN address may come later). The web app's Settings → Network
# changes bind, plex_bind, jellyfin_bind and discovery here, and keeps the
# other lines.
# bind = "0.0.0.0:7539"
# bind = "127.0.0.1:7539, 192.168.1.10:7539, 100.64.0.7:7539"

# Plex-compatible API, for tools built on Plex's API such as Kometa and
# Tautulli (docs/COMPATIBILITY.md). "web" (the default) answers on Pley's own
# port, telling its clients' requests from browsers'. "off" turns it off.
# Addresses give it a port of its own instead (Plex's is 32400), several as
# with bind.
# plex_bind = "web"
# plex_bind = "0.0.0.0:32400"

# Jellyfin-compatible API, for Jellyfin's apps and others that use its API
# (docs/COMPATIBILITY.md). "off" (the default) turns it off. "web" answers on
# Pley's own port, telling its apps' requests from browsers'. Addresses give
# it a port of its own instead (Jellyfin's is 8096), several as with bind.
# jellyfin_bind = "web"
# jellyfin_bind = "0.0.0.0:8096"

# Answer the Pley apps looking for servers on the local network (UDP, on the
# web port). Servers bound to 127.0.0.1 never answer.
# discovery = true

# Announce Pley by Bonjour, so Apple's apps find it without its address.
# Off unless turned on; --no-bonjour (PLEY_NO_BONJOUR) keeps it off.
# bonjour = true
# The network adapters to announce on, by name as Settings -> Network shows
# them; every one Pley listens on when left out or empty.
# bonjour_adapters = ["Ethernet"]

# Database, caches and artwork (default: %LOCALAPPDATA%\pley on Windows,
# ~/Library/Application Support/pley on macOS, ~/.local/share/pley on Linux).
# data_dir = "D:/Pley"

# Where the transcoder works: stream segments, converted downloads, its
# caches. Put it on a fast local disk with room to spare. Settings -> Server
# changes it too (from the next start); while it can't be written to, the
# default one in the data folder is used.
# transcode_dir = "D:/pley-transcode"

# FFmpeg binaries handed to the managed transcoder (default: from PATH).
# ffmpeg = "C:/ffmpeg/bin/ffmpeg.exe"
# ffprobe = "C:/ffmpeg/bin/ffprobe.exe"

# Serve the web UI from a folder instead of the copy embedded in the binary.
# web_dir = "web/dist"

# Managed transcoder (default): the pley-transcoder binary next to pley.
# transcoder_path = "C:/pley/pley-transcoder.exe"
# transcoder_max_jobs = 8

# External transcoder (e.g. a GPU machine). Media paths must be identical there.
# It takes a token of at least 16 characters (the same one on both sides),
# such as the output of `openssl rand -hex 32`.
# transcoder_url = "http://gpu-box:7540"
# transcoder_token = "<the token>"
