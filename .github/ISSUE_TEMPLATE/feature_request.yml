name: Request a feature
description: Something Pley could do. Discussions → Ideas is better for most ideas.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Most ideas are better started in **[Discussions → Ideas](https://github.com/pley-media-server/pley/discussions/new?category=ideas)**, where others can vote for them and say what they'd use them for. An issue suits a request that's small and clear already. Search the issues and Ideas first: if it's there, vote for it there.
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Pley to do
      description: Describe it as you'd use it, what you'd do and what you'd see.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to do, and how you do it today.
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Server
        - Web app
        - Desktop app (Windows, macOS, Linux)
        - Android phone or tablet
        - Android TV, Google TV or Fire TV
        - Samsung TV
        - LG TV
        - Roku
        - Kodi
        - Every app
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the issues and Ideas, and this isn't requested yet.
          required: true
