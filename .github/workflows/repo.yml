name: Repository

# What belongs to no single app: the workflows themselves, and the scripts
# that version and release the apps (docs/RELEASING.md), with every unit's
# manifests and CHANGELOG checked against each other, its version against
# the last release's, and README.md's latest releases against the CHANGELOGs.
on:
  push:
    branches: [master]
    # The units' first manifests have their versions (scripts/version.mjs).
    paths:
      - .github/workflows/**
      - scripts/version.mjs
      - scripts/changelog.mjs
      - scripts/release.mjs
      - scripts/release.test.mjs
      - "**/CHANGELOG.md"
      - README.md
      - apps/server/Cargo.toml
      - apps/desktop/package.json
      - apps/android/app/build.gradle.kts
      - apps/tizen/package.json
      - apps/tizen-native/Directory.Build.props
      - apps/webos/appinfo.json
      - apps/kodi/plugin.video.pley/addon.xml
      - apps/roku/manifest
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/version.mjs
      - scripts/changelog.mjs
      - scripts/release.mjs
      - scripts/release.test.mjs
      - "**/CHANGELOG.md"
      - README.md
      - apps/server/Cargo.toml
      - apps/desktop/package.json
      - apps/android/app/build.gradle.kts
      - apps/tizen/package.json
      - apps/tizen-native/Directory.Build.props
      - apps/webos/appinfo.json
      - apps/kodi/plugin.video.pley/addon.xml
      - apps/roku/manifest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its running checks; master runs them all.
  group: repo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commits.
jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  versions:
    name: Versions and changelogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history and the tags: the last release, which a pull
      # request's merge is checked against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun test ./scripts
      - run: bun scripts/version.mjs check
      # No unit below the version it had at the last release tag, and
      # README.md's latest releases as the CHANGELOGs have them. What else
      # waits for the next release is normal here, so pending isn't run.
      - run: bun scripts/release.mjs check
      - run: bun scripts/release.mjs
