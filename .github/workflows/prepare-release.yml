name: Prepare release
run-name: Prepare release${{ inputs.units && format(' of {0}', inputs.units) || '' }}

# Opens the pull request that releases units (docs/RELEASING.md): Actions ->
# Prepare release -> Run workflow, or `gh workflow run prepare-release.yml -f
# units="server kodi:minor"`. On the branch release/next, made from master, it
# bumps each unit with scripts/release.mjs, one commit each, then opens the
# pull request or updates the one open. Merging it starts the Release
# workflow. Running this again remakes the branch from master as it is then.
on:
  workflow_dispatch:
    inputs:
      units:
        description: "Units, each with its own bump where it differs from the one below, such as: server kodi:minor. Blank: every unit with Unreleased entries, but the web Samsung app (samsung)"
        type: string
        default: ""
      bump:
        description: The bump for units without their own
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

# Actions are pinned to commits.
jobs:
  prepare:
    name: Bumps and pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push release/next
      pull-requests: write # open its pull request
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: On the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are prepared from $DEFAULT_BRANCH; this run is on $GITHUB_REF"
            exit 1
          fi
      # The whole history and the tags: the last release, and what each unit
      # waits for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Bumps
        env:
          UNITS: ${{ inputs.units }}
          BUMP: ${{ inputs.bump }}
        run: |
          # The web Samsung app's package is signed by hand, so it's released only when named.
          if [ -z "${UNITS//[ ,]/}" ]; then
            UNITS=$(bun scripts/release.mjs --json | jq -r '.[] | select(.entries > 0 and .unit != "samsung") | .unit')
          fi
          if [ -z "$UNITS" ]; then
            echo "::error::No unit has entries under Unreleased in its CHANGELOG"
            exit 1
          fi
          # The commits are made in the name of whoever ran this.
          git config user.name "$(gh api "users/$GITHUB_ACTOR" --jq '.name // .login')"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git switch -C release/next
          for spec in ${UNITS//,/ }; do
            unit=${spec%%:*}
            how=$BUMP
            if [ "$spec" != "$unit" ]; then how=${spec#*:}; fi
            bun scripts/release.mjs "$unit" "$how" --commit
          done
          bun scripts/release.mjs pending --json > "$RUNNER_TEMP/pending.json"
          if [ "$(jq '.problems | length' "$RUNNER_TEMP/pending.json")" != 0 ]; then
            jq -r '.problems[] | "::error::\(.)"' "$RUNNER_TEMP/pending.json"
            exit 1
          fi
      - name: Pull request
        run: |
          pending="$RUNNER_TEMP/pending.json"
          title="Release $(jq -r '[.units[] | "\(.unit) \(.to)"] | join(", ")' "$pending")"
          {
            echo "Merging this releases $(jq -r '[.units[] | "\(.title) \(.to)"] | join(", ")' "$pending") under the tag \`$(jq -r .tag "$pending")\`, with these notes."
            echo
            echo "---"
            echo
            jq -r .notes "$pending"
          } > "$RUNNER_TEMP/body.md"
          git push --force origin release/next
          number=$(gh pr list --head release/next --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            url=$(gh pr view "$number" --json url --jq .url)
          elif ! url=$(gh pr create --base "$DEFAULT_BRANCH" --head release/next --title "$title" --body-file "$RUNNER_TEMP/body.md"); then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...release/next?expand=1"
            echo "::warning::This workflow may not open pull requests (Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests). Open it at $url"
          fi
          # The label tells release pull requests apart; one that can't be added doesn't hold the release back.
          case "$url" in
            */pull/*) gh pr edit "$url" --add-label release || echo "::warning::The release label couldn't be added to $url" ;;
          esac
          echo "$title: $url" >> "$GITHUB_STEP_SUMMARY"
