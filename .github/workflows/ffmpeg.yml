name: FFmpeg

# pley-ffmpeg, the FFmpeg the Docker image copies (deploy/ffmpeg), published
# to GitHub Container Registry from master when its recipe changes. Its tag
# is deploy/ffmpeg/tag.sh's; one already published is never built again.
# Pull requests build it in the Server workflow's Docker image job instead.
on:
  push:
    branches: [master]
    paths:
      - deploy/ffmpeg/**
      - "!deploy/ffmpeg/*.md"
      - .github/workflows/ffmpeg.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}

# Actions are pinned to commits.
jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # see whether the tag is published, before it is public
    outputs:
      name: ${{ steps.tag.outputs.name }}
      image: ${{ steps.tag.outputs.image }}
      published: ${{ steps.tag.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: tag
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pley-ffmpeg"
          image="$name:$(sh deploy/ffmpeg/tag.sh)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$image is published already"
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: tag
    if: needs.tag.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ffmpeg
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.tag.outputs.name }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pley-ffmpeg-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pley-ffmpeg-${{ matrix.arch }}
          provenance: false
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish the multi-platform image
        id: publish
        working-directory: ${{ runner.temp }}/digests
        env:
          NAME: ${{ needs.tag.outputs.name }}
          IMAGE: ${{ needs.tag.outputs.image }}
        run: |
          sources=()
          for digest in *; do sources+=("$NAME@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
