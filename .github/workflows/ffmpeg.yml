name: FFmpeg

# pley-ffmpeg, the FFmpeg the Docker image copies (deploy/ffmpeg), and its
# Windows build, which the Windows installer carries, published to GitHub
# Container Registry from master when their recipe changes. Their tags are
# deploy/ffmpeg/tag.sh's; one already published is never built again. Pull
# requests build them in the Server workflow instead (its Docker image and
# Windows FFmpeg jobs).
on:
  push:
    branches: [master]
    paths:
      - deploy/ffmpeg/**
      - "!deploy/ffmpeg/*.md"
      - .github/workflows/ffmpeg.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}

# Actions are pinned to commits.
jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # see whether the tag is published, before it is public
    outputs:
      name: ${{ steps.tag.outputs.name }}
      image: ${{ steps.tag.outputs.image }}
      published: ${{ steps.tag.outputs.published }}
      windows-image: ${{ steps.tag.outputs.windows-image }}
      windows-published: ${{ steps.tag.outputs.windows-published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: tag
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pley-ffmpeg"
          image="$name:$(sh deploy/ffmpeg/tag.sh)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$image is published already"
          fi
          windows="$name-windows:$(sh deploy/ffmpeg/tag.sh windows)"
          echo "windows-image=$windows" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$windows" >/dev/null 2>&1; then
            echo "windows-published=true" >> "$GITHUB_OUTPUT"
            echo "$windows is published already"
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: tag
    if: needs.tag.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ffmpeg
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.tag.outputs.name }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pley-ffmpeg-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pley-ffmpeg-${{ matrix.arch }}
          provenance: false
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish the multi-platform image
        id: publish
        working-directory: ${{ runner.temp }}/digests
        env:
          NAME: ${{ needs.tag.outputs.name }}
          IMAGE: ${{ needs.tag.outputs.image }}
        run: |
          sources=()
          for digest in *; do sources+=("$NAME@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}

  # The Windows build: files only (bin/ffmpeg.exe and ffprobe.exe, the
  # licence, the sources), cross-compiled on Linux, which the Server
  # workflow's release takes for the installers.
  windows:
    name: Build (Windows)
    needs: tag
    if: needs.tag.outputs.windows-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push the build and the mirrored dependency image
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The dependency image is about 9 GB: room for it beside the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # BtbN's images move on and old digests may go: the pinned one is
      # copied to this repository's registry once, and built from there.
      - name: Mirror the dependency image
        id: deps
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          pinned=$(sed -n 's/^ARG DEPS_IMAGE=//p' deploy/ffmpeg/Dockerfile.windows)
          digest=${pinned#*@}
          mirror="ghcr.io/${OWNER,,}/ffmpeg-builds-win64-gpl"
          tag="$mirror:${digest#sha256:}"
          docker buildx imagetools inspect "$tag" >/dev/null 2>&1 ||
            docker buildx imagetools create --tag "$tag" "$pinned"
          copied=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$copied" = "$digest" ] || { echo "::error::the mirror of $pinned has digest $copied"; exit 1; }
          echo "image=$mirror@$digest" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ffmpeg
          file: deploy/ffmpeg/Dockerfile.windows
          build-args: DEPS_IMAGE=${{ steps.deps.outputs.image }}
          tags: ${{ needs.tag.outputs.windows-image }}
          push: true
          provenance: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.tag.outputs.name }}-windows
          subject-digest: ${{ steps.build.outputs.digest }}
