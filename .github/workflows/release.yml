name: Release
run-name: Release${{ inputs.draft && ' (draft)' || '' }}

# Releases what master waits for (docs/RELEASING.md): every unit whose version
# went up since the last release tag, as the pull request that Prepare release
# opens bumps them. It runs when a push to master changes a unit's version, or
# by hand: Actions -> Release -> Run workflow, or `gh workflow run
# release.yml`. It refuses a unit whose CHANGELOG has entries its notes leave
# out, runs each unit's workflow with its release builds, tags the commit with
# the release's tag (release-<date>) and publishes one GitHub release with
# each unit's notes, checksums and build provenance. A server release also
# pushes the Docker image.
on:
  push:
    branches: [master]
    # Each unit's first manifest, which has its version (scripts/version.mjs).
    paths:
      - apps/server/Cargo.toml
      - apps/desktop/package.json
      - apps/android/app/build.gradle.kts
      - apps/tizen/package.json
      - apps/webos/appinfo.json
      - apps/kodi/plugin.video.pley/addon.xml
      - apps/roku/manifest
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the GitHub release a draft (the tag is made either way)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commits.
jobs:
  prepare:
    name: What waits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      units: ${{ steps.pending.outputs.units }}
      versions: ${{ steps.pending.outputs.versions }}
      tag: ${{ steps.pending.outputs.tag }}
      title: ${{ steps.pending.outputs.title }}
      notes: ${{ steps.pending.outputs.notes }}
    steps:
      - name: On the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are made from $DEFAULT_BRANCH; this run is on $GITHUB_REF"
            exit 1
          fi
      # The whole history and the tags: the last release, and the commits since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: The units waiting
        id: pending
        run: |
          bun scripts/release.mjs pending --json > pending.json
          jq -r '.units[] | .unit as $unit | .later[] | "::warning::\($unit) changed after its version was set, so its notes may not tell this: \(.)"' pending.json
          if [ "$(jq '.problems | length' pending.json)" != 0 ]; then
            jq -r '.problems[] | "::error::\(.)"' pending.json
            exit 1
          fi
          end="NOTES_$(openssl rand -hex 16)"
          {
            echo "units=$(jq -c '[.units[].unit]' pending.json)"
            echo "versions=$(jq -c '[.units[] | {(.unit): .to}] | add // {}' pending.json)"
            echo "tag=$(jq -r '.tag // ""' pending.json)"
            echo "title=$(jq -r .title pending.json)"
            echo "notes<<$end"
            jq -r .notes pending.json
            echo "$end"
          } >> "$GITHUB_OUTPUT"
          if [ "$(jq '.units | length' pending.json)" = 0 ]; then
            echo "Nothing to release: every unit has the version it had at $(jq -r '.since // "the last release"' pending.json)." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## $(jq -r .title pending.json)"
              echo
              echo "Tag \`$(jq -r .tag pending.json)\` on $GITHUB_SHA."
              echo
              jq -r .notes pending.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Each unit's own workflow, with its release builds: each uploads the files
  # for the release as release-* artifacts. Only the units waiting run.
  server:
    name: Server
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.units || '[]'), 'server')
    uses: ./.github/workflows/server.yml
    with:
      release: true
      version: ${{ fromJSON(needs.prepare.outputs.versions || '{}').server }}
    permissions:
      contents: read
      packages: write # the Docker image
      id-token: write # sign its provenance attestation (Sigstore)
      attestations: write # store the attestation

  desktop:
    name: Desktop
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.units || '[]'), 'desktop')
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
      version: ${{ fromJSON(needs.prepare.outputs.versions || '{}').desktop }}

  android:
    name: Android
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.units || '[]'), 'android')
    uses: ./.github/workflows/android.yml
    with:
      release: true
      version: ${{ fromJSON(needs.prepare.outputs.versions || '{}').android }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  samsung:
    name: Samsung TV
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.units || '[]'), 'samsung')
    uses: ./.github/workflows/samsung.yml
    with:
      release: true
      version: ${{ fromJSON(needs.prepare.outputs.versions || '{}').samsung }}

  lg:
    name: LG TV
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.units || '[]'), 'lg')
    uses: ./.github/workflows/lg.yml
    with:
      release: true
      version: ${{ fromJSON(needs.prepare.outputs.versions || '{}').lg }}

  kodi:
    name: Kodi
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.units || '[]'), 'kodi')
    uses: ./.github/workflows/kodi.yml
    with:
      release: true
      version: ${{ fromJSON(needs.prepare.outputs.versions || '{}').kodi }}

  roku:
    name: Roku
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.units || '[]'), 'roku')
    uses: ./.github/workflows/roku.yml
    with:
      release: true
      version: ${{ fromJSON(needs.prepare.outputs.versions || '{}').roku }}

  # Builds nothing: the jobs above build each file without the right to
  # write the release, and this one only checksums, attests, tags and
  # publishes, once every unit's build has passed.
  publish:
    name: Publish
    needs: [prepare, server, desktop, android, samsung, lg, kodi, roku]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.units != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # make the tag and the release
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UNITS: ${{ needs.prepare.outputs.units }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TITLE: ${{ needs.prepare.outputs.title }}
      SIGNED: ${{ needs.android.outputs.signed }}
    steps:
      # Samsung's package is made by hand, and Android's only with its key.
      - name: Files built
        id: files
        run: |
          if jq -e --arg signed "$SIGNED" 'any(.[]; . != "samsung" and (. != "android" or $signed == "true"))' <<< "$UNITS" > /dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.files.outputs.any == 'true'
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        if: steps.files.outputs.any == 'true'
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # `gh attestation verify <file> --repo <owner>/<repo>` proves a file came
      # from this workflow. GitHub keeps attestations for public repositories,
      # and for private ones on GitHub Enterprise Cloud only: elsewhere the
      # release goes on without them, with a warning.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.files.outputs.any == 'true'
        continue-on-error: true
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.spk
            dist/*.apk
            dist/*.aab
            dist/*.ipk
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
      - name: Without attestations
        if: steps.attest.outcome == 'failure'
        run: echo "::warning::No build provenance for this release (attestations need a public repository or GitHub Enterprise Cloud); SHA256SUMS is attached"
      - name: Notes
        env:
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          if jq -e 'any(. == "samsung")' <<< "$UNITS" > /dev/null; then
            printf '\n---\n\n%s\n' "The Samsung package is signed with a Samsung certificate, so it is made by hand: \`bun run --cwd apps/tizen package\` (docs/TV_PLATFORMS.md)." >> notes.md
            echo "::notice::Samsung's package is made by hand: bun run --cwd apps/tizen package, then attach it to $TAG"
          fi
          if jq -e 'any(. == "android")' <<< "$UNITS" > /dev/null && [ "$SIGNED" != true ]; then
            printf '\n---\n\nNo Android APK or Play bundle: the release key was not configured (docs/ANDROID.md, Releases).\n' >> notes.md
          fi
      # A re-run of a failed publish finds its tag on this commit and goes on.
      - name: Tag
        run: |
          on=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq "map(select(.ref == \"refs/tags/$TAG\")) | .[0].object.sha // \"\"")
          if [ -z "$on" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
            echo "Tagged $GITHUB_SHA as $TAG"
          elif [ "$on" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG exists already, on $on"
            exit 1
          fi
      # The repository's "Latest" release is the newest with the server.
      - name: Release
        env:
          DRAFT: ${{ inputs.draft }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ ${#files[@]} -gt 0 ]; then gh release upload "$TAG" "${files[@]}" --clobber; fi
          else
            args=(--verify-tag --title "$TITLE" --notes-file notes.md)
            if [ "$DRAFT" = true ]; then args+=(--draft); fi
            if jq -e 'any(. == "server")' <<< "$UNITS" > /dev/null; then args+=(--latest); else args+=(--latest=false); fi
            gh release create "$TAG" "${files[@]}" "${args[@]}"
          fi
          echo "$TITLE: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
