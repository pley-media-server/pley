name: Audit

# Known vulnerabilities in the Rust crates and JavaScript packages the lock
# files hold. Run by hand (Actions -> Audit -> Run workflow, or `gh workflow
# run audit.yml`), before a release or after an advisory: it runs on no
# schedule and on no push, so an advisory published for a version already in
# use doesn't fail anything by itself. Third-party licenses are checked by the
# Server workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commits.
jobs:
  rust:
    name: Rust crates (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      # Pley for LG TV is a workspace of its own, with its own Cargo.lock.
      - name: Pley for LG TV's crates
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/webos/Cargo.toml
          command: check advisories

  js:
    name: JavaScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Asks the registry about bun.lock's packages: nothing is installed.
      - run: bun audit --audit-level=moderate
