name: Kodi

# The Kodi add-on: one release unit (docs/RELEASING.md). Runs when it
# changes, and when the server does, since its end-to-end test signs in,
# browses and plays against a server built from the same commit. The Release
# workflow calls it with `release: true`, which adds the add-on's zip.
on:
  push:
    branches: [master]
    paths:
      - apps/kodi/**
      - packages/tv/test/fixtures/**
      - apps/server/**
      - apps/transcoder/**
      - packages/transcoder-api/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kodi.yml
      - "!**/CHANGELOG.md"
  pull_request:
    paths:
      - apps/kodi/**
      - packages/tv/test/fixtures/**
      - apps/server/**
      - apps/transcoder/**
      - packages/transcoder-api/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kodi.yml
      - "!**/CHANGELOG.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build the release's files too
        type: boolean
        default: false
      version:
        description: The version released (its manifests')
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its running checks; master runs them all.
  group: ${{ inputs.release && 'kodi-release' || format('kodi-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Actions are pinned to commits.
jobs:
  kodi:
    name: Kodi add-on
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Its version, which its CHANGELOG has (scripts/version.mjs).
      - run: bun scripts/version.mjs check kodi
      # Kodi 21 runs Python 3.8 on Windows: nothing newer may be used.
      - name: Python 3.8 syntax
        run: |
          python3 -c "import ast, pathlib
          for p in pathlib.Path('apps/kodi/plugin.video.pley').rglob('*.py'):
              ast.parse(p.read_text(encoding='utf-8'), str(p), feature_version=(3, 8))"
      - name: Unit tests
        working-directory: apps/kodi/tests
        run: python3 -m unittest discover -s . -p "test_*.py" -v
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests reuse master's cache without writing their own.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Signing in with a code, browsing, playing and renewing a token,
      # against a server built from this commit.
      - name: Against a real server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          cargo build -p pley-server -p pley-transcoder --locked
          cd apps/kodi/tests
          PLEY_BIN="$GITHUB_WORKSPACE/target/debug/pley" PLEY_FFMPEG_DIR=/usr/bin python3 -m unittest test_e2e -v
      - name: Package
        run: python3 apps/kodi/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pley-kodi
          path: dist/plugin.video.pley-*.zip
          if-no-files-found: error
          retention-days: 14

  # ---- Release (called by release.yml) ---------------------------------------

  # The add-on as Kodi installs it from a zip file: plugin.video.pley-<version>.zip.
  package:
    name: Package
    if: inputs.release
    needs: kodi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 apps/kodi/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-kodi
          path: dist/plugin.video.pley-*.zip
          if-no-files-found: error
