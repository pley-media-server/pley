name: Samsung TV

# The Samsung TV app (apps/tizen, built with packages/tv): one release unit
# (docs/RELEASING.md). Runs when either changes.
# Its package is signed with a Samsung certificate only its owner can make,
# so a release has none: `bun run --cwd apps/tizen package` makes it
# (docs/TV_PLATFORMS.md). The Release workflow still calls this first.
on:
  push:
    branches: [master]
    paths:
      - apps/tizen/**
      - packages/tv/**
      - package.json
      - bun.lock
      - bunfig.toml
      - scripts/commit.mjs
      - scripts/commit.d.mts
      - .github/workflows/samsung.yml
      - "!**/CHANGELOG.md"
  pull_request:
    paths:
      - apps/tizen/**
      - packages/tv/**
      - package.json
      - bun.lock
      - bunfig.toml
      - scripts/commit.mjs
      - scripts/commit.d.mts
      - .github/workflows/samsung.yml
      - "!**/CHANGELOG.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build the release's files too (Samsung's package is made by hand)
        type: boolean
        default: false
      version:
        description: The version released (its manifests')
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its running checks; master runs them all.
  group: ${{ inputs.release && 'samsung-release' || format('samsung-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commits.
jobs:
  samsung:
    name: Samsung TV app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Its manifests carry one version, which its CHANGELOG has (scripts/version.mjs).
      - run: bun scripts/version.mjs check samsung
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/tv check
      - run: bun run --cwd apps/tizen check
      # Packaging needs Samsung's tools and certificate; the bundle is built here.
      - run: bun run --cwd apps/tizen build
