labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Search Ideas first: if someone has suggested it already, vote for it there and say what you'd use it for. Something that's broken is a bug: [report it as an issue](https://github.com/pley-media-server/pley/issues/new?template=bug_report.yml).
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Pley to do
      description: Describe it as you'd use it, what you'd do and what you'd see.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to do, and how you do it today.
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Server
        - Web app
        - Desktop app (Windows, macOS, Linux)
        - Android phone or tablet
        - Android TV, Google TV or Fire TV
        - Samsung TV
        - LG TV
        - Roku
        - Kodi
        - Every app
