body:
  - type: markdown
    attributes:
      value: |
        Ask anything about installing, setting up or using Pley. The [docs](https://github.com/pley-media-server/pley#docs) may already answer it. Something that's broken is a bug: [report it as an issue](https://github.com/pley-media-server/pley/issues/new?template=bug_report.yml). When an answer solves it, mark it as the answer so the next person finds it.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do, and what you've tried.
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: 0.1.15
  - type: dropdown
    id: install
    attributes:
      label: How the server runs
      options:
        - Docker
        - Windows
        - macOS
        - Linux
        - Synology
        - Unraid
        - Other
  - type: input
    id: app
    attributes:
      label: The app and the device
      placeholder: Android 0.1.17 on a Chromecast with Google TV
