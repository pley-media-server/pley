[workspace]
resolver = "3"
members = [
    "apps/server",
    "apps/transcoder",
    "packages/transcoder-api",
]
default-members = ["apps/server", "apps/transcoder"]
# The desktop app is a workspace of its own (Tauri and its webview
# libraries), so server builds don't compile it.
exclude = ["apps/desktop/src-tauri"]

# NOTE: all three are under LICENSE (AGPL-3.0-only), and none may depend on a
# copyleft-only crate (scripts/check-licenses.ps1, LICENSING.md).
# - apps/server               pley-server; must never depend on pley-transcoder
# - apps/transcoder           pley-transcoder; a separate program, spoken to only over HTTP
# - packages/transcoder-api   pley-transcoder-api; wire types shared by both

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
