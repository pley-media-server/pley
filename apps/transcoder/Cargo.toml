[package]
name = "pley-transcoder"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "Pley transcoder: FFmpeg-based media engine (probing, HLS transcoding, HDR/Dolby Vision tone mapping) for the Pley media server"
license = "AGPL-3.0-only"
publish = false

# This crate is intentionally self-contained (no workspace inheritance): a
# separate program, which the server only speaks to over HTTP.

[[bin]]
name = "pley-transcoder"
path = "src/main.rs"

[dependencies]
pley-transcoder-api = { path = "../../packages/transcoder-api", version = "0.1.4" }

anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Ties ffmpeg's lifetime to the transcoder's (job object / parent-death signal).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The icon and version information on Windows (build.rs).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
# Paused time in tests.
tokio = { version = "1", features = ["test-util"] }
