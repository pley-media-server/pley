[package]
name = "pley-server"
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
description = "Pley media server: libraries, metadata, users, playback sessions and the web UI"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "pley"
path = "src/lib.rs"

[[bin]]
name = "pley"
path = "src/main.rs"

[dependencies]
# Shared wire types. The server must NOT depend on the transcoder crate
# itself; it talks to the transcoder process over HTTP.
pley-transcoder-api = { path = "../../packages/transcoder-api" }

anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
dirs = "7"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
# The HTTP listeners (src/http.rs), as axum runs them but with a timeout for
# request headers (both already come with axum).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The network adapters' IPv4 addresses and masks, for Bonjour's links
# (src/bonjour.rs).
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
mime_guess = "2"
mimalloc = { version = "0.1", default-features = false }
notify = "8"
parking_lot = "0.13"
# QR codes of authenticator secrets (two-step sign-in), no dependencies.
qrcodegen = "1.8"
# XMLTV guides, read as they stream (MIT), and gzipped ones (MIT OR Apache-2.0).
quick-xml = "0.41"
flate2 = "1"
# Seals two-step secrets and computes their codes (already used by rustls).
ring = "0.17"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "gzip", "stream"] }
rust-embed = "8"
# Which folder a link leads to, so that walks of library folders don't go
# round in circles (already used by walkdir).
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Bonjour's socket: port 5353 shared with the system's responder, and the
# multicast group joined and sent to on each adapter (src/bonjour.rs).
socket2 = { version = "0.6", features = ["all"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "compression-br", "compression-gzip", "compression-zstd", "trace", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Search compares names without their accents.
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# Desktop integration: system tray icon (see src/desktop).
open = { version = "5", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSThread"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem over D-Bus in pure Rust: no GTK, so headless builds stay lean.
ksni = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
# flock() for the single-instance lock (src/instance.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # The network adapters, for Settings -> Network (src/network.rs).
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    # The Windows service (src/service): its accounts, sign-ins and the
    # Service Control Manager.
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # The processors' and memory's use, for the dashboard (src/resources.rs).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    # Which disks a volume is on, and whether they spin, for seek previews
    # (src/disks.rs).
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[features]
default = ["tray"]
# Tray icon while running in an interactive desktop session.
tray = ["dep:open", "dep:tray-icon", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:ksni"]

[dev-dependencies]
tempfile = "3.20"
tokio-tungstenite = "0.30"
