[package]
name = "pley-ui"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Pley for LG TV: the interface toolkit (focus, input, animation, theme and kit)"
license = "AGPL-3.0-only"
publish = false

[dependencies]
pley-base = { path = "../base" }
# Reads packages/themes/themes.json, built in: the themes' colors. The tests read
# packages/placeholder/placeholder.json too, which the placeholder's gradient is held to.
serde_json = "1.0.154"
