[package]
name = "pley-i18n-macros"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Pley for LG TV: t!, which checks a word's key and values against the English catalogs as the code builds"
license = "AGPL-3.0-only"
publish = false

[lib]
proc-macro = true

[dependencies]
# Reads the English catalogs while the code builds (on the build machine only).
serde_json = "1.0.154"
