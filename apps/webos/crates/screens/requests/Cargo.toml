[package]
name = "pley-requests"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Pley for LG TV: Discover, a TMDB title's page and the requests"
license = "AGPL-3.0-only"
publish = false

[dependencies]
pley-base = { path = "../../base" }
pley-core = { path = "../../core" }
pley-ui = { path = "../../ui" }
pley-kit = { path = "../../kit" }
