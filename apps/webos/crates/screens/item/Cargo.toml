[package]
name = "pley-item"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Pley for LG TV: a title's page, its actions and a person's page"
license = "LicenseRef-Restricted"
publish = false

[dependencies]
pley-base = { path = "../../base" }
pley-core = { path = "../../core" }
pley-ui = { path = "../../ui" }
pley-kit = { path = "../../kit" }
pley-shell = { path = "../../shell" }
log = "0.4.29"

[dev-dependencies]
# The simulator with this crate's screens alone (examples/item_sim.rs), and the fake server.
pley-host = { path = "../../host" }
pley-fixtures = { path = "../../fixtures" }
# The tests' fake TV plays with the simulated engine.
pley-player = { path = "../../player" }
