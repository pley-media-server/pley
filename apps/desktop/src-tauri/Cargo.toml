[package]
name = "pley-desktop"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "Pley for Windows, macOS and Linux: a window on a Pley server's web app"
license = "AGPL-3.0-only"
publish = false

# A workspace of its own (see the root Cargo.toml): server builds and their
# CI don't compile Tauri and the webview libraries.
[workspace]

[lib]
name = "pley_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
if-addrs = "0.15"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
