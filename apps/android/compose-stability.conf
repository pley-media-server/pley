// Classes the Compose compiler treats as stable, so screens skip what didn't
// change: the server's answers are immutable data classes, and the screens
// never change a list they were given.
app.pley.android.model.**
kotlin.collections.*

// What the screens draw, made by their ViewModels off the main thread
// (:core:screens, which the Compose compiler doesn't see): values that are
// never changed once made, errors they hold included. Listed one by one,
// none that holds anything that changes, so a screen given an equal one
// again (the server saying what it said) skips it.
app.pley.android.data.Loadable<*>
