# cargo-deny configuration (https://github.com/EmbarkStudios/cargo-deny).
#   cargo install cargo-deny && cargo deny check licenses
# Third-party crates must be permissively licensed. Our own crates are
# unpublished (`publish = false`) and skipped here; scripts/check-licenses.ps1
# also keeps copyleft-only crates out of the server and the transcoder, and
# the transcoder out of the server (see LICENSING.md).

[graph]
all-features = false
exclude-dev = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[advisories]
# Known vulnerabilities in any crate that gets built fail the check (see
# .github/workflows/audit.yml). Unmaintained crates only when pley depends
# on them directly: for the others there is nothing to do but wait for the
# crate that uses them to move on.
unmaintained = "workspace"
yanked = "warn"
